name: Pakistan Brand Sale Monitor

on:
  schedule:
    # Brand website monitor — 4x daily
    - cron: '0 8,12,16,20 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ddgs

      - name: Set monitor script
        id: decide
        run: echo "script=run_monitor.sh" >> $GITHUB_OUTPUT

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PRICE_ALERT_EMAIL: ${{ secrets.PRICE_ALERT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          chmod +x ${{ steps.decide.outputs.script }}
          bash ${{ steps.decide.outputs.script }} 2>&1 | tee monitor-output.txt
        continue-on-error: true

      - name: Check for errors
        if: failure() || contains(steps.*.outcome, 'failure')
        run: |
          echo "::error::Monitor failed — check logs above"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs-${{ github.run_number }}
          path: |
            monitor-output.txt
            logs/
          retention-days: 7
