name: Facebook & Google Ads Sale Monitor

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-sale-monitor
  cancel-in-progress: false

jobs:
  monitor-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Facebook & Google Ads Monitor
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: ${{ secrets.DISCORD_USERNAME || 'Sale Monitor' }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_AVATAR_URL }}
        run: python monitor_ads.py --brands brands_ads.json

      - name: Commit updated Ads monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brands_ads.json public/brands_ads.json public/ads_state.json state/ads_state.json state/ads_history.json state/sale_state.json state/sent_alerts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Facebook and Google Ads monitor state across all Pakistani sectors"
            git pull --rebase || true
            git push
          fi
